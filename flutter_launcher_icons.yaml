# App icon settings. After changing an image in assets/icon/, regenerate the
# Android and iOS icon files with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  # Replace the default Flutter icon (instead of adding a second one).
  android: true
  ios: true

  # The artwork flattened onto the cream background, with no transparency:
  # used for iOS (which does not allow transparent icons) and for Android
  # versions older than 8, which have no adaptive icons.
  image_path: "assets/icon/icon.png"
  # Safety net: icon.png already has no alpha channel.
  remove_alpha_ios: true

  # Android 8+ adaptive icon: the launcher crops these two layers into its
  # own shape (circle, squircle, ...). The default 16% foreground inset keeps
  # the wallet inside the area every shape shows.
  adaptive_icon_background: "#F5F0E6"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
